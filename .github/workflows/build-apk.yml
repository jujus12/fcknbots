name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android source layout
        run: |
          mkdir -p src/main/java/com/example/w0wingen src/main/res/values src/main/res/xml
          cp AndroidManifest.xml src/main/AndroidManifest.xml
          cp MainActivity.kt TimerService.kt src/main/java/com/example/w0wingen/
          cp strings.xml src/main/res/values/strings.xml
          cp accessibility_config.xml src/main/res/xml/accessibility_config.xml

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: w0wingen-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error